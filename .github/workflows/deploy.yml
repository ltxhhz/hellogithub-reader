name: Update And Deploy

on:
  schedule:
    - cron: '0 6 28 * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy.yml'
      - 'docs/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout site
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.27.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch upstream repositories
        shell: bash
        run: |
          mkdir -p source
          git clone --depth 1 https://github.com/521xueweihan/HelloGitHub.git source/HelloGitHub

      - name: Generate documentation
        run: node scripts/build.mjs --resource=jsdelivr

      - name: Build VitePress site
        run: pnpm docs:build
        env:
          VITEPRESS_BASE: ${{ steps.pages.outputs.base_path }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
